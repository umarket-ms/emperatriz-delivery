name: Deploy to Dokploy

on:
  push:
    branches: [desarrollo, staging-qa, main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy deployment (Dev)
        if: github.ref_name == 'desarrollo'
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "{\"ref\":\"refs/heads/${{ github.ref_name }}\",\"repository\":{\"full_name\":\"${{ github.repository }}\"}}"

      - name: Trigger Dokploy deployment (Staging)
        if: github.ref_name == 'staging-qa'
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL_STAGING }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "{\"ref\":\"refs/heads/${{ github.ref_name }}\",\"repository\":{\"full_name\":\"${{ github.repository }}\"}}"

      - name: Trigger Dokploy deployment (Prod)
        if: github.ref_name == 'main'
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL_PROD }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "{\"ref\":\"refs/heads/${{ github.ref_name }}\",\"repository\":{\"full_name\":\"${{ github.repository }}\"}}"
