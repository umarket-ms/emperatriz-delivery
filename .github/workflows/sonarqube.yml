name: SonarQube Analysis

on:
  # DESACTIVADO 2026-11-01: SonarQube ahora es solo-Tailscale
  # (http://100.105.48.32:9000) y los runners de GitHub (ubuntu-latest,
  # en la nube) no lo alcanzan. Se conserva solo disparo manual para
  # re-activar cuando haya un runner con acceso a la tailnet o si
  # SonarQube vuelve a exponerse.
  workflow_dispatch:

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.tiendasdominicanas.com.do
